# Seminal works — the papers that introduced the concepts, and the modern papers that
# carry control ideas into AI.
#
# Every row needs a year and a resolvable source (doi, arxiv, or url). tools/check.py
# enforces it: an uncheckable citation is worse than no citation, because it looks like
# evidence. `bridge: rigorous|analogy` is set on the AI-side rows and is the single most
# important column in this file — conflating a theorem with a metaphor is the failure mode
# this repo most fears.

works:
  # ---- the canon ------------------------------------------------------------------
  - id: maxwell-governors-1868
    title: On Governors
    year: 1868
    authors: [maxwell]
    venue: Proceedings of the Royal Society of London
    idea: Write the machine's equations down and check whether the wobbles die out.
    doi: 10.1098/rspl.1867.0055
    concepts: [feedback, asymptotic-stability]
    verified: true

  - id: lyapunov-1892
    title: The General Problem of the Stability of Motion
    year: 1892
    authors: [lyapunov]
    venue: Doctoral thesis; English translation International Journal of Control 55 (1992)
    idea: Find a downhill energy score and you have proved stability, without solving anything.
    doi: 10.1080/00207179208934253
    concepts: [lyapunov-function, asymptotic-stability]
    verified: true

  - id: nyquist-1932
    title: Regeneration Theory
    year: 1932
    authors: [nyquist]
    venue: Bell System Technical Journal 11:126–147
    idea: Encircle a point on a plot and your amplifier will sing.
    doi: 10.1002/j.1538-7305.1932.tb02344.x
    concepts: [margins, feedback]
    verified: true

  - id: black-1934
    title: Stabilized Feedback Amplifiers
    year: 1934
    authors: [black]
    venue: Bell System Technical Journal 13:1–18
