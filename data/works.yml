  # ---- the rigorous math bridge ----------------------------------------------------
  # Every row here is `bridge: rigorous`. This is the one place in the repo where
  # "control theory applied to generative AI" is a theorem rather than a metaphor.

  - id: zhou-lu-sicon-2025
    title: A Policy Gradient Framework for Stochastic Optimal Control Problems with Global Convergence Guarantee
    year: 2025
    authors: [mo-zhou, jianfeng-lu]
    venue: SIAM Journal on Control and Optimization 63(4):2605–2631
    idea: >-
      The method that trains RLHF — policy gradient — provably finds the true global optimum
      on continuous-time stochastic optimal control, not just a local one.
    doi: 10.1137/23M1570739
    arxiv: "2302.05816"
    concepts: [pg-global-convergence, stochastic-optimal-control]
    bridge: rigorous
    verified: true
    note: >-
      Author order is Mo Zhou then Jianfeng Lu. A widely circulated secondary article
      reversed it; verified against the SIAM page and the arXiv record.

