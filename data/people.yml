# Key contributors.
#
# `owns` is the ONE concept most associated with this person. Deliberately singular:
# a person who "owns" six things owns none, and the discipline of picking one is what
# makes this list navigable rather than encyclopaedic.
#
# `verified` is false where a primary source was not resolved in the research pass. Two
# rows below carry contested death dates and are marked unverified rather than asserted —
# these are real people and the repo publishes its unverified_rate rather than guessing.
#
# `advised_by` builds the doctoral lineage edges in the knowledge graph.

people:
