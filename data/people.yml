  # =====================================================================================
  # The rigorous math bridge — stochastic optimal control ↔ generative modelling
  #
  # This cluster matters more than its size suggests. Everywhere else in this repo the
  # control-to-AI mapping is tagged `analogy`; here it is a theorem. Diffusion sampling IS
  # stochastic optimal control, flow matching IS a transport equation, and RLHF's policy
  # gradient HAS a convergence proof in continuous time. These are the people who proved it.
  # =====================================================================================

  - id: mo-zhou
    name: Mo Zhou (周默)
    years: ""
    contribution: >-
      Proved that policy gradient — the method underneath RLHF — actually converges globally
      on continuous-time stochastic optimal control, and built score-based solvers for
      mean-field control problems.
    owns: policy gradient for stochastic optimal control
    owns_concept: pg-global-convergence
    era: learning
    labs: [pku-math, ucla-math, duke-math]
    advised_by: [jianfeng-lu]
    homepage: https://mozhou1995.github.io/
    verified: true
    note: >-
      B.S. Mathematics, Tsinghua 2018. Ph.D. Mathematics, Duke 2023 under Jianfeng Lu.
      UCLA 2023-2026 under Stanley Osher, promoted to Assistant Adjunct Professor in
      August 2025. Joined Peking University School of Mathematical Sciences, Department of
      Information and Computational Science, as Assistant Professor in September 2026.
      UCLA IDRE Fellow, September 2024. Recruiting postdocs, PhD and MS students; welcomes
      undergraduate researchers. His homepage tagline is literally "Mathematics · Control ·
      Learning", which is this repo's thesis stated as a job description.

  - id: osher
    name: Stanley Osher
    years: ""
    contribution: >-
      Track a moving shape by tracking a water level on an invisible landscape instead of
      the shape itself — and four decades later, the same PDE machinery became the
      numerical engine of generative modelling.
    owns: level-set methods
    owns_concept: dynamic-programming
    era: modern
    labs: [ucla-math]
    homepage: https://www.math.ucla.edu/~sjo/
    verified: true
    note: >-
      Carl Friedrich Gauss Prize 2014 (ICM Seoul, "for applications of mathematics").
      Four landmark lines: level-set methods with Sethian (1988), ENO/WENO schemes with
      Harten, Engquist and Chakravarthy, total-variation denoising with Rudin and Fatemi
      (1992), and Bregman iteration (2005).

  - id: jianfeng-lu
    name: Jianfeng Lu
    years: ""
    contribution: >-
      Proves how deep and how wide a network must be to approximate a function or a
      high-dimensional PDE solution — the theory that says whether a method can work at all.
    owns: deep network approximation theory
    owns_concept: deep-bsde
    era: learning
    labs: [duke-math]
    homepage: https://sites.math.duke.edu/~jianfeng/
    verified: true

  - id: wuchen-li
