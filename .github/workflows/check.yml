name: check

# The whole gate: offline, deterministic, no keys, no network.
# If it is green on a bare machine, the repo is green.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (pyyaml + pytest only — the core needs nothing else)
        run: python -m pip install --upgrade pip pyyaml pytest
      - name: make check
        run: make check
      - name: Report the metrics
        run: python3 scripts/ca.py stats
